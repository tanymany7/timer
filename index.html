
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Teeny Tiny Surprise ♡</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <main class="container">
    <div class="heart">♡</div>

    <p class="eyebrow">A LITTLE SOMETHING FOR YOU</p>

    <h1>Something special<br>is coming...</h1>

    <p class="message">
      I've been working on something just for you.
      <br>
      You'll get to see it very soon. ♡
    </p>

    <section class="countdown" aria-label="Time remaining">
      <div class="time-box">
        <span id="days">05</span>
        <small>DAYS</small>
      </div>

      <div class="time-box">
        <span id="hours">00</span>
        <small>HOURS</small>
      </div>

      <div class="time-box">
        <span id="minutes">00</span>
        <small>MINUTES</small>
      </div>

      <div class="time-box">
        <span id="seconds">00</span>
        <small>SECONDS</small>
      </div>
    </section>

  

    <div class="decoration">✧ ˚ · .</div>
  </main>
</body>
</html>
